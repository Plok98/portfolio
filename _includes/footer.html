  <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <span class="copyright">Copyright &copy; {{ site.title }} {{ 'now' | date: "%Y" }}</span>
                </div>
                <div class="col-md-6">
                    <ul class="list-inline social-buttons">
                        {% assign linkedin = site.social | where: "title", "linkedin" | first %}
                        {% assign instagram = site.social | where: "title", "instagram" | first %}
                        {% assign github = site.social | where: "title", "github" | first %}
                        <li><a href="{{ linkedin.url | default: '#' }}"><i class="fa fa-linkedin"></i></a>
                        </li>
                        <li><a href="{{ instagram.url | default: '#' }}"><i class="fa fa-instagram"></i></a>
                        </li>
                        <li><a href="{{ github.url | default: '#' }}"><i class="fa fa-github"></i></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
